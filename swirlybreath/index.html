<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Zen Breathing</title>
<style>
:root{--bg:#f4f1ea;--fg:#2f3a36;--mute:#7a857f;--a:#5f9c8a;--b:#d9a66b;--card:#e9e4d9;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171a;--fg:#e4ece8;--mute:#8a9a94;--a:#6fc4ad;--b:#e0b57e;--card:#1b2629}}
:root[data-theme="dark"]{--bg:#10171a;--fg:#e4ece8;--mute:#8a9a94;--a:#6fc4ad;--b:#e0b57e;--card:#1b2629}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:Georgia,'Times New Roman',serif;display:flex;flex-direction:column;align-items:center;justify-content:space-between;overflow:hidden}
h1{font-weight:400;letter-spacing:.3em;font-size:1rem;text-transform:uppercase;margin:1.5rem 0 0;color:var(--mute)}
#stage{position:relative;flex:1;width:100%;min-height:0}
canvas{position:absolute;inset:0;width:100%;height:100%}
#label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none;text-align:center}
#word{font-size:1.6rem;letter-spacing:.12em;transition:opacity .6s}
#sub{font-size:.85rem;color:var(--mute);margin-top:.4rem}
.panel{width:100%;max-width:520px;padding:0 1rem 1.25rem;box-sizing:border-box;text-align:center}
.panel p{margin:.2rem 0 .7rem;font-size:.85rem;color:var(--mute);min-height:1.2em}
.levels{display:flex;gap:.5rem;justify-content:center;flex-wrap:wrap}
button{font:inherit;background:var(--card);color:var(--fg);border:1px solid transparent;border-radius:999px;padding:.55rem 1.1rem;cursor:pointer;font-size:.9rem}
button[aria-pressed="true"]{border-color:var(--a);color:var(--a)}
#go{margin-top:.9rem;padding:.65rem 2rem;background:var(--a);color:var(--bg)}
</style>
</head>
<body>
<h1>Breathe</h1>
<div id="stage">
  <canvas id="c"></canvas>
  <div id="label"><div id="word">Ready</div><div id="sub"></div></div>
</div>
<div class="panel">
  <p id="desc"></p>
  <div class="levels" role="group" aria-label="Level of calm" id="levels"></div>
  <button id="go">Begin</button>
</div>
<script>
const levels=[
 {n:'Settle',in:4,hold:1,out:4,amp:.45,spin:.35,arms:6,d:'Even and steady. 4 seconds in, 1 hold, 4 out.'},
 {n:'Calm',in:4,hold:1,out:6,amp:.6,spin:.25,arms:5,d:'A longer exhale to soften. 4 in, 1 hold, 6 out.'},
 {n:'Deep',in:5,hold:1.5,out:8,amp:.75,spin:.16,arms:4,d:'Slow and spacious. 5 in, 1.5 hold, 8 out.'},
 {n:'Still',in:6,hold:2,out:10,amp:.9,spin:.09,arms:3,d:'Deepest calm. 6 in, 2 hold, 10 out.'}
];
let L=1,running=false,t0=0,breath=0,spin=0,last=0,dir=1,dirS=1;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const word=document.getElementById('word'),sub=document.getElementById('sub'),desc=document.getElementById('desc');
const box=document.getElementById('levels'),go=document.getElementById('go');
function drawButtons(){box.innerHTML='';levels.forEach((l,i)=>{const b=document.createElement('button');b.textContent=l.n;b.setAttribute('aria-pressed',i===L);
 b.onclick=()=>{L=i;t0=performance.now();drawButtons()};box.appendChild(b)});desc.textContent=levels[L].d}
drawButtons();
go.onclick=()=>{running=!running;go.textContent=running?'Pause':'Resume';t0=performance.now();if(!running){word.textContent='Paused';sub.textContent=''}};
function size(){const r=cv.getBoundingClientRect(),d=devicePixelRatio||1;cv.width=r.width*d;cv.height=r.height*d;ctx.setTransform(d,0,0,d,0,0)}
addEventListener('resize',size);size();
const ease=x=>.5-.5*Math.cos(Math.PI*x);
function css(v){return getComputedStyle(document.documentElement).getPropertyValue(v).trim()}
function mix(h1,h2,k){const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));const a=p(h1),b=p(h2);return a.map((v,i)=>Math.round(v+(b[i]-v)*k))}
function frame(now){
 const dt=Math.min(.05,(now-last)/1000||0);last=now;const lv=levels[L];
 let target=breath;
 if(running){
  const cyc=lv.in+lv.hold+lv.out,t=((now-t0)/1000)%cyc;
  if(t<lv.in){target=ease(t/lv.in);dir=1;word.textContent='Breathe in';sub.textContent=Math.ceil(lv.in-t)}
  else if(t<lv.in+lv.hold){target=1;dir=0;word.textContent='Hold';sub.textContent=''} // swirl rests, fully open
  else{target=1-ease((t-lv.in-lv.hold)/lv.out);dir=-1;word.textContent='Breathe out';sub.textContent=Math.ceil(cyc-t)}
 } else if(word.textContent==='Ready'||word.textContent==='Paused'){target=breath*.98+(.15)*.02}
 breath=running?target:breath+(.15-breath)*dt*1.5;
 dirS+=(dir-dirS)*Math.min(1,dt*7); // quick but soft reversal, in step with the prompt
 spin+=dt*lv.spin*(.5+breath)*dirS;
 const w=cv.clientWidth,h=cv.clientHeight,cx=w/2,cy=h/2,R=Math.min(w,h)*.46;
 ctx.clearRect(0,0,w,h);
 const rad=R*(.2+.8*breath*(.7+.3*lv.amp)); // small when exhaled, full when inhaled
 const a=css('--a'),b=css('--b');
 const N=lv.arms,steps=90;
 for(let arm=0;arm<N;arm++){
  for(let i=0;i<steps;i++){
   const f=i/steps,r=rad*f;
   const ang=arm*2*Math.PI/N+f*(3.2+breath*1.6)+spin;
   const x=cx+Math.cos(ang)*r,y=cy+Math.sin(ang)*r;
   const c=mix(a,b,f*.8+breath*.2);
   ctx.fillStyle=`rgba(${c[0]},${c[1]},${c[2]},${(.15+.75*(1-f*.5))*(.45+.55*breath)})`;
   ctx.beginPath();ctx.arc(x,y,1.2+f*4.5*(.6+breath*.6),0,7);ctx.fill();
  }
 }
 const g=ctx.createRadialGradient(cx,cy,0,cx,cy,rad*.5+10),c0=mix(a,b,.3);
 g.addColorStop(0,`rgba(${c0[0]},${c0[1]},${c0[2]},${.25+.25*breath})`);g.addColorStop(1,`rgba(${c0[0]},${c0[1]},${c0[2]},0)`);
 ctx.fillStyle=g;ctx.beginPath();ctx.arc(cx,cy,rad*.5+10,0,7);ctx.fill();
 requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
